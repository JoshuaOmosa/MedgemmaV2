[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medgemma-aegis"
version = "0.1.0"
description = "Air-gapped clinical voice-to-SOAP pipeline: local Whisper + local MedGemma with security guardrails."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pydantic>=2.5,<3"]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
nemo = ["nemoguardrails>=0.9"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
